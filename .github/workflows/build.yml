name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Sentinel.sln

    - name: Build
      run: dotnet build Sentinel.sln -c Release --no-restore

    - name: Test
      run: dotnet test tests/Sentinel.Tests/Sentinel.Tests.csproj -c Release --no-build --verbosity normal
